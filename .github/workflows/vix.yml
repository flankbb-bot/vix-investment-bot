name: VIX投资助手

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  vix:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取VIX并发送微信
        env:
          SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
        run: |
          python -c "
import urllib.request
import json
import time

# 抓取VIX
url = 'https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX'
with urllib.request.urlopen(url) as response:
    data = json.loads(response.read())
    vix = data['chart']['result'][0]['meta']['regularMarketPrice']
    
# 生成建议
if vix < 20:
    msg = f'观望。VIX={vix}'
elif vix < 25:
    msg = f'警戒。VIX={vix}，等待回落'
else:
    msg = f'低档买进信号！VIX={vix}，恐慌情绪高'

# 发送微信
import os
sendkey = os.environ.get('SENDKEY')
if sendkey:
    urllib.request.urlopen(f'https://sctapi.ftqq.com/{sendkey}.send?title=VIX建议&desp={msg}')
print('完成')
"
