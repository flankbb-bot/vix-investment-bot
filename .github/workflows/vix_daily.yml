name: Daily VIX Alert

on:
  workflow_dispatch:  # 手动触发（先测这个）
  schedule:
    - cron: '1 1 * * *'

jobs:
  vix-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Run VIX Script
        env:
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
        run: |
          python -m pip install --quiet yfinance pandas requests
          python vix_alert.py
